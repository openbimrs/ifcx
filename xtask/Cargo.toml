[package]
name = "xtask"
description = "Repository automation for openbimrs/ifcx: documentation generation and drift checks."
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
# Tooling, never released: scripts/release-crate.py refuses it and
# `cargo package` skips it.
publish = false

[dependencies]
# Pinned to versions whose MSRV is at most the workspace's 1.88, as in
# openbimrs/ifc's xtask.
cargo_metadata = "=0.19.2"
serde_json = "1.0.151"
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
quote = "1.0.47"
