[package]
name = "openbim-ifcx-geometry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifcx"
homepage = "https://github.com/openbimrs/ifcx"
documentation = "https://docs.rs/openbim-ifcx-geometry"
readme = "README.md"
description = "Renderer-neutral geometry and viewer helpers for IFC5 / IFCX: transforms, meshes, curves, point clouds, presentation, a flat render scene, and GLB export."
keywords = ["bim", "openbim", "ifcx", "geometry", "gltf"]
categories = ["graphics", "rendering::data-formats"]

[dependencies]
openbim-ifcx = { path = "../openbim-ifcx", version = "0.1.0" }
# Decodes `points::base64` and `pcd::base64`. Without default features: no
# std and none of its SIMD (unsafe) engines, only the scalar decoder.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# Same version openbim-ifcx already uses; named for the `Attributes` impls.
indexmap = "2"
# Attribute values are serde_json::Value in openbim-ifcx's public API; same
# crate and version the core crate already pulls in.
serde_json = "1"

[dev-dependencies]
# `FsResolver` (feature `fs`) for `ifcx2glb --resolve-imports` and its test.
openbim-ifcx = { path = "../openbim-ifcx", version = "0.1.0", features = ["fs"] }
