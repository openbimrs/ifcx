name: Pages

# Builds the documentation site and deploys it to GitHub Pages:
#
#   https://openbimrs.github.io/ifcx/                 VitePress, from docs/
#   https://openbimrs.github.io/ifcx/api/rustdoc/     rustdoc of the workspace
#   https://openbimrs.github.io/ifcx/viewer/          the demo viewer, demo/
#
# Everything is built from this commit's source: the viewer uses
# @openbim/ifcx built here, never a published version. Before upload the
# whole site is checked for buildingSMART material against an upstream
# checkout at the revision the evidence was recorded at. Pull requests that
# touch the site only build it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "xtask/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      # Sources of generated pages.
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "scripts/upstream-drift/baseline.txt"
      - "scripts/check-leakage.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "demo/**"
      - "xtask/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-leakage.py"
      - "crates/openbim-ifcx-wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is already deploying.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Python
        # xtask reads the Python binding's API with python3's `ast`.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install wasm-bindgen CLI
        # Must equal the `wasm-bindgen` pin in crates/openbim-ifcx-wasm/Cargo.toml.
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Generated docs must match their sources
        run: cargo run --quiet --locked -p xtask -- docs --check
      - name: Install docs toolchain
        run: npm ci --no-audit --no-fund
      - name: Build the documentation site
        run: npm run docs:build

      # rustdoc is built from the same doc comments the gate checks with
      # -D warnings and nested under the site at /api/rustdoc/, beside the
      # hand-written /api/ landing page.
      - name: Build the Rust API reference
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Nest rustdoc under the site at /api/rustdoc/
        run: |
          mkdir -p docs/.vitepress/dist/api/rustdoc
          cp -r target/doc/. docs/.vitepress/dist/api/rustdoc/

      - name: Build and test @openbim/ifcx from source
        # Writes crates/openbim-ifcx-wasm/pkg, which demo/vite.config.js
        # aliases; the checks include the browser builds in headless Chrome.
        run: crates/openbim-ifcx-wasm/scripts/build-npm-pkg.sh
      - name: Install viewer dependencies
        working-directory: demo
        run: npm ci --no-audit --no-fund
      - name: Build the viewer
        working-directory: demo
        run: npm run build
      - name: Nest the viewer under the site at /viewer/
        run: cp -r demo/dist docs/.vitepress/dist/viewer

      - name: Check out upstream at the recorded revision
        # Only to compare against: nothing from it is built or published.
        run: |
          rev=$(grep -oE '[0-9a-f]{40}' scripts/upstream-drift/baseline.txt | head -n 1)
          git init -q .upstream
          git -C .upstream fetch -q --depth 1 https://github.com/buildingSMART/IFC5-development.git "$rev"
          git -C .upstream checkout -q FETCH_HEAD
      - name: Reject buildingSMART material in the built site
        env:
          IFCX_UPSTREAM_DIR: .upstream
        run: python3 scripts/check-leakage.py docs/.vitepress/dist

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
